# nginx/nginx.conf — نقطة الدخول الوحيدة لكل حركة الويب (المرحلة الرابعة:
# Nginx كـreverse proxy) — قرار مقصود: لا موازنة حمل بين نسخ متعددة (ما
# فيه أصلاً — حاوية app واحدة فقط، راجع تعليق docker-compose.yml)، فقط
# طبقة واحدة أمام الحاوية تقدّم ثلاث فوائد:
#   1) تقدّم نسخة الفرونت إند الثابتة المبنية (frontend/build) مباشرة من
#      volume مشترك — أسرع وأخف بكثير من خادم Express لملفات ثابتة بحتة
#      (كان backend/serveFrontend.js، حُذف الآن).
#   2) توجّه /api/* و/uploads/* داخلياً لحاوية app (المنفذ 8000) — المنفذ
#      الوحيد المكشوف على الجهاز المضيف صار 80 (Nginx نفسه)؛ app وpostgres
#      وredis صاروا معزولين تماماً داخل شبكة Docker الداخلية (راجع إزالة
#      "ports:" منهم بـdocker-compose.yml) — تحسين أمني حقيقي، لا فقط تنظيم.
#   3) جاهز لإضافة SSL/TLS لاحقاً بتغيير صغير (راجع التعليق أسفل server{}
#      بالأسفل) — لا إعادة كتابة كاملة، فقط server block ثانٍ + توجيه.
#
# ── HTTP فقط حالياً، بقرار مقصود ─────────────────────────────────────────────
# الوصول عن بُعد مخطَّط له عبر VPN/WireGuard لا HTTPS عام (راجع القرار
# بمحادثة التخطيط) — لا شهادة SSL بعد. الكوكي auth_token نفسه مضبوط
# secure:false حالياً تبعاً لنفس القرار (راجع routes/authRoutes.js).

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  # ضغط استجابات الفرونت إند (JS/CSS المبنية بحجم كبير عادةً) — نفس تحسين
  # الأداء المقصود من كل هذا الإعداد.
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # ── مهم جداً: يطابق حد رفع الملفات الفعلي بالباك إند (express.json limit:
  # '50mb' بـserver.js) — قارئا الفواتير/الوصفات بالذكاء الاصطناعي يرسلان
  # صور مُرمَّزة base64 قد تصل لهذا الحجم. القيمة الافتراضية بـNginx (1m)
  # كانت سترفض هذه الطلبات بخطأ 413 قبل وصولها لحاوية app إطلاقاً — تأكّدنا
  # فعلياً بالاختبار (راجع ملاحظة الاختبار الشامل بعد هذا الملف).
  client_max_body_size 50m;

  server {
    listen 80;
    server_name _;

    # نسخة الفرونت إند الثابتة المبنية — volume مشترك مع حاوية app (للقراءة
    # فقط هنا)، تُحدَّث تلقائياً بكل إعادة تشغيل لحاوية app (راجع CMD
    # بـDockerfile) لتطابق دائماً آخر صورة مبنية فعلياً.
    root /usr/share/nginx/html;
    index index.html;

    # ── API — توجيه داخلي لحاوية app عبر اسم الخدمة بشبكة Docker ────────────
    # proxy_http_version 1.1 + Connection '' ضروريان لإبقاء اتصالات
    # keepalive حقيقية بين Nginx وapp (الإعداد الافتراضي HTTP/1.0 يفتح
    # اتصالاً جديداً كل طلب). مهلات القراءة/الإرسال مرفوعة لـ130 ثانية —
    # أطول قليلاً من OLLAMA_TIMEOUT_MS الافتراضي (120000ms بـutils/
    # ollamaService.js) حتى لا يقطع Nginx استدعاء ذكاء اصطناعي محلي طويل
    # نسبياً وهو لا يزال يعمل فعلياً بنجاح.
    location /api/ {
      proxy_pass http://app:8000;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_send_timeout 130s;
      proxy_read_timeout 130s;
    }

    # ── الملفات المرفوعة (وثائق، صور...) — مسار محمي بتسجيل دخول بالباك إند
    # نفسه (auth middleware، راجع app.use('/uploads', auth, ...) بـserver
    # .js) — Nginx فقط يمرّر الطلب، لا يتحقق من أي صلاحية بنفسه.
    location /uploads/ {
      proxy_pass http://app:8000;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── ملفات ثابتة مبنية بأسماء مُبصمة (hashed، مثل main.a1b2c3.js) — آمنة
    # للتخزين المؤقت الدائم بمتصفح المستخدم لأن أي تحديث فعلي يغيّر الاسم
    # نفسه، لا محتوى نفس الاسم.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # ── React Router (SPA) — أي مسار لا يطابق ملفاً فعلياً بمجلد build
    # (مثل /patients أو /procurement) يرجع index.html نفسه دائماً غير
    # مُخبَّأ (كل نشرة جديدة تغيّر أسماء ملفات JS/CSS المُشار لها بداخله)،
    # وReact Router بجانب المتصفح يتولى عرض الصفحة الصحيحة. بدون هذا،
    # تحديث الصفحة (F5) بأي مسار غير الرئيسي يرجع 404 من Nginx مباشرة.
    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
    }
  }

  # ── لإضافة SSL/TLS لاحقاً (تغيير صغير، لا إعادة كتابة) ──────────────────────
  # عند توفّر شهادة حقيقية:
  #   1) استبدل server{} أعلاه بـ:
  #        server { listen 80; server_name _; return 301 https://$host$request_uri; }
  #   2) أضف server{} ثانٍ يحمل كل location{} أعلاه حرفياً، مع:
  #        listen 443 ssl;
  #        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  #        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  #   3) اربط مجلد الشهادات الحقيقي بـvolume جديد على خدمة nginx
  #      بـdocker-compose.yml (مثل ./ssl:/etc/nginx/ssl:ro)، وافتح المنفذ
  #      443 بجانب 80.
  #   4) فعّل secure:true بكوكي auth_token (راجع USE_HTTPS بـ.env
  #      وauthRoutes.js) — الآن آمن لأن الاتصال كله مشفَّر فعلياً.
}
