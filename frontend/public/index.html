<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1a6bab" />
  <meta name="description" content="SIHATUNA IRAQ - نظام إدارة المعلومات الصحية" />
  <title>صحتنا عراق | SIHATUNA IRAQ</title>
  <script>
    // يُنفَّذ فوراً (قبل تحميل React وقبل أول رسم للصفحة) لتفادي ومضة
    // الوضع الفاتح ثم القفز للداكن — نفس منطق القيمة الافتراضية الموجود في
    // AppContext.js (localStorage.getItem('theme') || 'light') لكن هنا
    // مباشرة على <html> قبل أي CSS يُرسَم.
    (function () {
      try {
        var theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    Single consolidated font request for every family/weight the app uses
    (previously split across this file's own <link> for just Cairo, plus a
    second, overlapping @import in index.css for Cairo+Tajawal+Inter+IBM
    Plex Sans Arabic — two separate round trips to Google Fonts, with the
    Cairo weight lists not even matching). display=swap is already in the
    URL, so text renders in a fallback font immediately either way; the
    media="print" / onload swap below additionally keeps this stylesheet
    from blocking first render while it downloads. noscript covers the
    case where that onload handler never runs.
  -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
