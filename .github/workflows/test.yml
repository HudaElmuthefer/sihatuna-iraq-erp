name: Run tests automatically

# ── Why this file exists ────────────────────────────────────────────────────
# Before this, the tests (70 Jest tests) existed but nothing ran them
# automatically — you had to remember to run them manually (npm test) before
# every push. If you forgot, you could push a change that breaks something
# without noticing. Now: every time code is pushed to GitHub (or a pull
# request is opened), GitHub automatically prepares a clean environment,
# installs the packages, and runs all the tests — showing a clear ✅ or ❌
# right on the repository page.
#
# Important note: many tests in this project (RBAC, Excel import...) need a
# real PostgreSQL instance to run at full strength — without it they safely
# skip themselves instead of failing. We added a PostgreSQL service here
# (services: postgres) specifically so these tests run with full coverage
# here automatically, not just the part that doesn't need a database.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Allows running this workflow manually from the Actions tab on the
  # repository page ("Run workflow" button), on any branch you choose —
  # instead of waiting for a push or pull request.
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sihatuna_iraq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend packages
        working-directory: backend
        run: npm ci

      - name: Prepare database schema
        working-directory: backend
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d sihatuna_iraq_test -f ../database/postgres_schema.sql
        continue-on-error: true # If the file needs extensions unavailable in the default container, don't stop all of CI because of it — the tests themselves will safely skip (pgAvailable check).

      - name: Apply additional SQL migrations (migrations-sql/)
        # Same step that happens automatically on every local/Docker deploy
        # (see run-migrations.js) — without it, tables added in later stages
        # (medical_codes, drug_interactions...) wouldn't exist at all in the
        # CI database, so any test depending on them would fail with a real
        # connection error instead of running at full coverage. Actually
        # idempotent (see the comment in each migrations-sql/*.sql file) — no
        # harm running it here even if postgres_schema.sql above already
        # applied some of it by mistake (schema_migrations prevents repeats).
        working-directory: backend
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DATABASE: sihatuna_iraq_test
        run: node run-migrations.js

      - name: Run backend tests
        working-directory: backend
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DATABASE: sihatuna_iraq_test
          JWT_SECRET: ci-test-secret-not-for-production
          NODE_ENV: test
        run: npm test

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend packages
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Build frontend (catches code errors before deploy)
        working-directory: frontend
        env:
          CI: true
        run: npm run build

  # Runs the full Playwright e2e suite (e2e/) against the production build
  # (frontend/build served statically, same as a real deploy) -- the final
  # gate after the unit-level jobs above both pass. Uses its own isolated
  # Postgres service and test database, seeded with a throwaway admin
  # account; no real data involved anywhere in this job.
  e2e:
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sihatuna_iraq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend packages
        working-directory: backend
        run: npm ci

      - name: Install frontend packages
        working-directory: frontend
        run: npm ci

      - name: Install e2e packages
        working-directory: e2e
        run: npm ci

      # Browsers are installed inside this runner only, every run -- never
      # cached or reused from the local machine.
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Prepare database schema
        working-directory: backend
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d sihatuna_iraq_test -f ../database/postgres_schema.sql
        continue-on-error: true # Same reasoning as the test-backend job above.

      - name: Apply additional SQL migrations (migrations-sql/)
        working-directory: backend
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DATABASE: sihatuna_iraq_test
        run: node run-migrations.js

      - name: Seed the e2e test database
        working-directory: e2e
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DATABASE: sihatuna_iraq_test
        run: node seed.js

      - name: Build the frontend production bundle
        working-directory: frontend
        env:
          CI: true
        run: npm run build

      # Backgrounded on purpose: a GitHub Actions job's background processes
      # stay alive across the remaining steps in the same job, so the
      # backend and the static frontend server both keep running until the
      # e2e step below is done with them.
      - name: Start the backend against the test database
        working-directory: backend
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DATABASE: sihatuna_iraq_test
          JWT_SECRET: ci-test-secret-not-for-production
          NODE_ENV: test
          NODE_APP_INSTANCE: '1' # skip the hourly auto-backup/HL7 listener for this CI run
          PORT: 8000
        run: node server.js > backend.log 2>&1 &

      - name: Serve the frontend production build
        working-directory: frontend
        run: npx serve -s build -l 3000 > frontend.log 2>&1 &

      - name: Wait for the backend and the frontend to respond
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8000/ > /dev/null && break; sleep 2; done
          curl -sf http://localhost:8000/ > /dev/null || (echo "Backend did not come up" && cat backend/backend.log && exit 1)
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 2; done
          curl -sf http://localhost:3000/ > /dev/null || (echo "Frontend did not come up" && cat frontend/frontend.log && exit 1)

      - name: Run the Playwright e2e suite against the production build
        working-directory: e2e
        env:
          BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
